<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozdrav pro Patrika Maršálka</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            width: 60%;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #60a5fa;
            font-size: 42px;
        }

        p {
            font-size: 22px;
        }

        .emoji {
            font-size: 60px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="emoji">👋</div>

        <h1>Ahoj Patriku Maršálku!</h1>

        <p>Vítej na Docker Nginx serveru 🚀</p>

        <p>Web běží správně a všechno funguje.</p>

        <p><strong>Měj super den 😎</strong></p>
    </div>
</body>
</html>
