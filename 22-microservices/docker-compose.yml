version: '3.8'
services:
  user-service:
    build:
      context: ./services/user-service
    ports:
      - "3001:3000"
    environment:
      SERVICE_NAME: user-service

  product-service:
    build:
      context: ./services/product-service
    ports:
      - "3002:3000"
    environment:
      SERVICE_NAME: product-service

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "3003:3000"
    environment:
      SERVICE_NAME: order-service

  api-gateway:
    build:
      context: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - product-service
      - order-service
