version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: react
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reactapp
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://react:password@db:5432/reactapp

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api
