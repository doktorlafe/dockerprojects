version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: password
      POSTGRES_DB: djangodb
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: djangodb
      DB_USER: django
      DB_PASSWORD: password
      DB_HOST: db
    volumes:
      - .:/app
